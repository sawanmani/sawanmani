<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 116" width="800" height="116" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <title>Featured work — decorative header</title>
  <desc>A gradient headline with a breathing glow, a sweeping highlight, orbiting sparks and twinkling stars introducing the featured projects.</desc>
  <defs>
    <linearGradient id="fb-title" gradientUnits="userSpaceOnUse" x1="240" y1="0" x2="560" y2="0">
      <stop offset="0" stop-color="#247BFF"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#FF354F"/>
    </linearGradient>
    <linearGradient id="fb-rule" gradientUnits="userSpaceOnUse" x1="230" y1="0" x2="570" y2="0">
      <stop offset="0" stop-color="#247BFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7C3AED" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FF354F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fb-sweep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="120" y2="0">
      <stop offset="0" stop-color="#F4F6FC" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F4F6FC" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F4F6FC" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fb-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#247BFF" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#7C3AED" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- breathing glow behind the headline -->
  <ellipse cx="400" cy="42" rx="270" ry="42" fill="url(#fb-glow)">
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" values="0.65;1;0.65"/>
  </ellipse>

  <text x="400" y="46" text-anchor="middle" font-size="30" font-weight="800" letter-spacing="5" fill="url(#fb-title)">FEATURED WORK</text>
  <text x="400" y="70" text-anchor="middle" font-size="11" font-weight="500" letter-spacing="6" fill="#A7B0C3">SELECTED BUILDS · LIVE REPOSITORIES</text>

  <!-- animated rule -->
  <rect x="230" y="80" width="340" height="2" rx="1" fill="url(#fb-rule)"/>
  <!-- sweeping highlight travelling along the rule -->
  <rect x="230" y="78" width="120" height="6" fill="url(#fb-sweep)" opacity="0.6">
    <animate attributeName="x" dur="4s" repeatCount="indefinite" values="230;450;230"/>
  </rect>

  <!-- twinkling sparkles + travelling orbit sparks -->
  <g fill="#F4F6FC">
    <path d="M244 30 l1.7 4.6 4.6 1.7 -4.6 1.7 -1.7 4.6 -1.7 -4.6 -4.6 -1.7 4.6 -1.7 z" opacity="0.3"><animate attributeName="opacity" dur="2.6s" repeatCount="indefinite" values="0.15;0.9;0.15"/></path>
    <path d="M560 24 l1.4 3.8 3.8 1.4 -3.8 1.4 -1.4 3.8 -1.4 -3.8 -3.8 -1.4 3.8 -1.4 z" opacity="0.3"><animate attributeName="opacity" dur="3.1s" begin="0.7s" repeatCount="indefinite" values="0.1;0.85;0.1"/></path>
    <circle cx="300" cy="16" r="1.5" opacity="0.3"><animate attributeName="opacity" dur="2.2s" begin="0.4s" repeatCount="indefinite" values="0.1;0.8;0.1"/></circle>
    <circle cx="512" cy="60" r="1.5" opacity="0.3"><animate attributeName="opacity" dur="2.9s" begin="1s" repeatCount="indefinite" values="0.1;0.8;0.1"/></circle>
    <circle r="2.2" fill="#247BFF">
      <animate attributeName="cx" dur="7s" repeatCount="indefinite" values="240;560;240"/>
      <animate attributeName="cy" dur="7s" repeatCount="indefinite" values="92;92;92"/>
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0.2;1;0.2"/>
    </circle>
    <circle r="2.2" fill="#FF354F">
      <animate attributeName="cx" dur="7s" begin="3.5s" repeatCount="indefinite" values="240;560;240"/>
      <animate attributeName="cy" dur="7s" begin="3.5s" repeatCount="indefinite" values="92;92;92"/>
      <animate attributeName="opacity" dur="7s" begin="3.5s" repeatCount="indefinite" values="0.2;1;0.2"/>
    </circle>
  </g>
</svg>
